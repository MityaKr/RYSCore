plugins {
    id 'net.neoforged.moddev'
}

// Общий код компилируется против чистого Minecraft (NeoForm), без API загрузчика: так он переносится на Fabric.
neoForge {
    neoFormVersion = neo_form_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

// проверки видят игру и её библиотеки (Gson, slf4j)
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.1'

    // проверки без игры: реестр переезда, файл отметок, читатель SNBT
    testCompileOnly 'org.jetbrains:annotations:26.0.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
